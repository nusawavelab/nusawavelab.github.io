name: NusawaveLab
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Zensical
        run: pip install zensical
      - name: Build documentation
        run: zensical build --clean
      # -----------------------------------------------
      # Push the built site/ to the gh-pages branch
      # -----------------------------------------------
      - name: Push build to gh-pages branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Switch to gh-pages branch
          git checkout gh-pages || git checkout --orphan gh-pages
          # Remove old files
          git rm -rf . || true
          # Copy new site build files
          cp -r site/* .
          # Commit
          git add .
          git commit -m "Update built site from CI $(date)" || true
          # Push
          git push origin gh-pages --force
      # -----------------------------------------------
      # Deploy using GitHub Pages artifact pipeline
      # (GitHub Pages official mechanism)
      # -----------------------------------------------
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment