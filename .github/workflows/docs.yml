name: MonsunLab

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Build documentation
        run: zensical build --clean

      - name: Deploy labs.monsun.io redirect to monsun.io/labs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp redirect/index.html index.html
          cp redirect/404.html 404.html
          echo "labs.monsun.io" > CNAME
          git add -A
          git commit -m "Redirect labs.monsun.io to monsun.io/labs" || true
          git push origin gh-pages --force

      - name: Trigger monsun.io/labs deploy
        if: ${{ secrets.MONSUNIC_DEPLOY_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.MONSUNIC_DEPLOY_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/monsunic/monsunic.github.io/dispatches \
            -d '{"event_type":"labs-updated"}'
